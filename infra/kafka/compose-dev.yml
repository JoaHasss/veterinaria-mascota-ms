name: veterinaria-kafka-dev

# Broker Kafka en modo KRaft (sin ZooKeeper) + Kafka UI para el entorno DEV.
# - Listener EXTERNAL (localhost:19092): lo usan los microservicios que corren en el host.
# - Listener INTERNAL (kafka:9092): lo usan los contenedores de la misma red (Kafka UI, pruebas Python).
services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: veterinaria-kafka-dev
    restart: unless-stopped
    ports:
      - "19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Los topicos se crean de forma explicita (consola o KafkaTopicsConfig) con 3 particiones.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_dev_data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: veterinaria-kafka-ui-dev
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "18085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: veterinaria-dev
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"

  eventos-py:
    build: ./eventos-py
    container_name: veterinaria-eventos-py
    profiles: ["pruebas"]
    depends_on:
      - kafka
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      TOPICO: cita-eventos

volumes:
  kafka_dev_data:
