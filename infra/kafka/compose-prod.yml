name: veterinaria-kafka-prod

# Definicion PROD: mismos componentes con puertos 29092/28085.
# Los microservicios en contenedores usan veterinaria-kafka:9092 (red interna).
services:
  veterinaria-kafka:
    image: apache/kafka:3.9.1
    container_name: veterinaria-kafka
    restart: unless-stopped
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://veterinaria-kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@veterinaria-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_prod_data:/var/lib/kafka/data
    networks:
      - veterinaria-net

  veterinaria-kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: veterinaria-kafka-ui
    restart: unless-stopped
    depends_on:
      - veterinaria-kafka
    ports:
      - "28085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: veterinaria-prod
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: veterinaria-kafka:9092
    networks:
      - veterinaria-net

volumes:
  kafka_prod_data:

networks:
  veterinaria-net:
    name: veterinaria-net
