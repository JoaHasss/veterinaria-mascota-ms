name: veterinaria-keycloak-dev

# S07b: Keycloak reemplaza a veterinaria-auth-ms como servidor de autorizacion.
# El realm "veterinaria" (roles, cliente veterinaria-frontend, mapper idCliente
# y usuarios semilla) se importa desde ./realm al primer arranque.
services:
  keycloak-db:
    image: postgres:17-alpine
    container_name: veterinaria-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: veterinaria_keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      # 15436 ya lo usa la base de veterinaria-cliente-ms
      - "15438:5432"
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d veterinaria_keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    container_name: veterinaria-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/veterinaria_keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin123
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "18180:8080"   # HTTP (issuer: http://localhost:18180/realms/veterinaria)
      - "19000:9000"   # management: /health/ready y /metrics
    volumes:
      - ./realm:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy

volumes:
  keycloak_db_data:
