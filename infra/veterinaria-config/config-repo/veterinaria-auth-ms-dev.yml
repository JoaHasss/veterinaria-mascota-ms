server:
  port: 8085

spring:
  datasource:
    url: jdbc:postgresql://localhost:15435/veterinaria_auth_db
    username: veterinaria
    password: veterinaria
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: localhost:19092
    consumer:
      group-id: veterinaria-auth-ms
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: pe.edu.upeu.auth.event.ClienteResultadoEvento
        spring.json.use.type.headers: false
        spring.json.trusted.packages: "*"
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    pe.edu.upeu.auth: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:18761/eureka
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

jwt:
  issuer: http://localhost:8085
  expiracion-segundos: 3600

# S9: saga de alta de cliente (auth-ms <-> cliente-ms)
app:
  kafka:
    topics:
      usuario-eventos: usuario-eventos
      cliente-eventos: cliente-eventos
