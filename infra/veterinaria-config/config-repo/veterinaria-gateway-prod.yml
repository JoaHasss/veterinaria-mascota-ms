server:
  port: 18080

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
          - id: veterinaria-mascota-ms
            uri: lb://veterinaria-mascota-ms
            predicates:
              - Path=/api/v1/mascotas/**,/api/v1/especies/**,/api/v1/insumos/**
          - id: citas-ms
            uri: lb://citas-ms
            predicates:
              - Path=/api/v1/citas/**
          - id: veterinaria-cliente-ms
            uri: lb://veterinaria-cliente-ms
            predicates:
              - Path=/api/v1/clientes/**
          - id: veterinaria-pago-ms
            uri: lb://veterinaria-pago-ms
            predicates:
              - Path=/api/v1/pagos/**
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://veterinaria-keycloak:8080/realms/veterinaria

# S11: el navegador solo habla con el Gateway; CORS se resuelve aqui y no en
# cada microservicio (ver CorsConfig del Gateway).
veterinaria:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

logging:
  level:
    pe.edu.upeu.gateway: INFO
    org.springframework.security: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: never

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://veterinaria-eureka:18761/eureka}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
