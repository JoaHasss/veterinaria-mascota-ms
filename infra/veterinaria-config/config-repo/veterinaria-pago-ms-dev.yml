server:
  port: 8087

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:18180/realms/veterinaria
  datasource:
    url: jdbc:postgresql://localhost:15437/veterinaria_pago_db
    username: veterinaria
    password: veterinaria
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  kafka:
    bootstrap-servers: localhost:19092
    consumer:
      group-id: veterinaria-pago-ms
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer: un mensaje mal formado se registra y se descarta
      # en lugar de dejar al consumidor en un bucle de errores.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: pe.edu.upeu.pago.event.CitaCreadaEvento
        spring.json.use.type.headers: false
        spring.json.trusted.packages: "*"
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false

app:
  kafka:
    topics:
      cita-eventos: cita-eventos
      pago-eventos: pago-eventos

logging:
  level:
    pe.edu.upeu.pago: DEBUG
    org.apache.kafka: WARN
    org.springframework.kafka.listener.KafkaMessageListenerContainer: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:18761/eureka
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
